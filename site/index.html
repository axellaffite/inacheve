<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Inachevé : un jeu d'action sur une page de cahier, réécrit par une IA toutes les 12 heures.">
<title>Inachevé</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%92%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
@font-face { font-family: 'Cursive'; src: url('fonts/cursive-400.woff2') format('woff2'); font-display: block; }
@font-face { font-family: 'Main'; src: url('fonts/main-400.woff2') format('woff2'); font-weight: 400; font-display: block; }
@font-face { font-family: 'Main'; src: url('fonts/main-700.woff2') format('woff2'); font-weight: 700; font-display: block; }

:root {
  --paper: #fdfcf6;
  --ink: #1d3a8a;
  --graphite: #2e2e33;
  --margin: #d6575b;
  --rule: #a9b3e3;
  --highlight: #f6e75e;
  --desk: #e9e6dc;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --desk: #23252b; }
}
:root[data-theme="dark"] { --desk: #23252b; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--desk); font-family: 'Main', 'Segoe Print', 'Bradley Hand', cursive; color: var(--ink); touch-action: none; -webkit-user-select: none; user-select: none; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#safe { position: fixed; inset: 0; pointer-events: none; visibility: hidden;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

#ui { position: fixed; left: 0; bottom: 0; display: flex; gap: 10px; flex-wrap: wrap;
  padding: 0 0 calc(12px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px)); }
#ui.hidden, .btn.hidden { display: none; }
.btn { font: 700 21px/1 'Main', cursive; color: var(--ink); background: var(--paper);
  border: 2px solid var(--ink); border-radius: 4px 7px 5px 6px; padding: 7px 14px 8px; cursor: pointer; transform: rotate(-1deg); }
.btn:nth-child(2) { transform: rotate(1.2deg); }
.btn:nth-child(3) { transform: rotate(-0.4deg); }
.btn:hover { background: var(--highlight); }
.btn:focus-visible { outline: 3px solid var(--margin); outline-offset: 3px; }
#btnPause { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: none; }
#btnPause.show { display: block; }

dialog#journal { border: none; padding: 0; background: transparent; max-width: min(720px, 94vw); width: 100%; max-height: 88vh; }
dialog#journal::backdrop { background: rgba(30, 32, 40, 0.55); }
.sheet { background: var(--paper); color: var(--graphite); border-radius: 3px; max-height: 88vh; overflow-y: auto;
  padding: 28px 28px 28px 74px; position: relative;
  background-image: linear-gradient(90deg, transparent 54px, var(--margin) 54px, var(--margin) 56px, transparent 56px),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px);
  box-shadow: 0 18px 50px rgba(0,0,0,0.35); }
.sheet header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.sheet h2 { font: 400 34px/1.3 'Cursive', cursive; color: var(--ink); margin: 0 0 8px; }
.sheet p, .sheet li { font: 400 22px/32px 'Main', cursive; margin: 0; }
.sheet .lede { margin-bottom: 18px; max-width: 60ch; }
.entry { margin: 0 0 30px; }
.entry h3 { font: 700 27px/32px 'Main', cursive; color: var(--ink); margin: 0; }
.entry time { font: 400 20px/32px 'Main', cursive; color: var(--margin); }
.entry ul { margin: 4px 0 10px; padding-left: 22px; }
.entry video { width: 100%; border: 2px solid var(--graphite); border-radius: 3px; background: #ddd; margin-top: 6px; }
.entry .novideo { color: #7a7a80; font-style: normal; }
#entries { list-style: none; padding: 0; margin: 0; }
@media (max-width: 560px) { .sheet { padding: 22px 16px 22px 58px; background-image: linear-gradient(90deg, transparent 42px, var(--margin) 42px, var(--margin) 44px, transparent 44px), repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px); } }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Zone de jeu Inachevé"></canvas>
<div id="safe"></div>
<div id="ui">
  <button class="btn" id="btnJournal" type="button">Carnet de bord</button>
  <button class="btn" id="btnBest" type="button">Bestiaire</button>
  <button class="btn" id="btnSound" type="button">Son : activé</button>
  <button class="btn" id="btnCalm" type="button">Secousses : oui</button>
  <button class="btn" id="btnVoisin" type="button">Voisin : non</button>
  <button class="btn" id="btnSpeed" type="button">Vitesse : 100&#8239;%</button>
  <button class="btn" id="btnDevoir" type="button">Devoir du jour</button>
  <button class="btn hidden" id="btnTitre" type="button">Retour au titre</button>
  <button class="btn" id="btnBureau" type="button">Le bureau</button>
</div>
<button class="btn" id="btnPause" type="button" aria-label="Pause">Pause</button>
<dialog id="journal" aria-labelledby="journalTitle">
  <div class="sheet">
    <header><h2 id="journalTitle">Carnet de bord</h2><button class="btn" id="btnCloseJournal" type="button">Fermer</button></header>
    <p class="lede">Ce jeu est écrit par Claude, une IA d'Anthropic, en totale autonomie. Toutes les 12 heures, une nouvelle itération ajoute, corrige ou réinvente quelque chose. Chaque entrée garde une vidéo du jeu tel qu'il était ce jour-là.</p>
    <ol id="entries"></ol>
  </div>
</dialog>

</body>
</html>
